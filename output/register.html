<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市管网资产数字化台账 - 注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #0d2137 50%, #0a1628 100%);
            color: #e0e8f0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .bg-grid {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(0,180,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,180,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }
        .bg-glow { position: fixed; width: 500px; height: 500px; border-radius: 50%; filter: blur(120px); opacity: 0.15; pointer-events: none; }
        .bg-glow-1 { background: #00b4ff; top: -150px; left: -100px; }
        .bg-glow-2 { background: #00ff88; bottom: -150px; right: -100px; }
        .form-container {
            position: relative; z-index: 10;
            width: 460px;
            background: rgba(0,30,60,0.7);
            border: 1px solid rgba(0,180,255,0.25);
            border-radius: 12px;
            padding: 36px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0,180,255,0.08), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .form-header { text-align: center; margin-bottom: 28px; }
        .form-header h1 {
            font-size: 20px; font-weight: bold;
            background: linear-gradient(90deg, #00b4ff, #00ff88);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 2px; margin-bottom: 6px;
        }
        .form-header p { font-size: 13px; color: #5a8aaa; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #7eb8db; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%; height: 40px;
            background: rgba(0,20,40,0.6);
            border: 1px solid rgba(0,180,255,0.2);
            border-radius: 6px; padding: 0 12px;
            font-size: 13px; color: #e0e8f0; outline: none;
            transition: border-color 0.2s;
        }
        .form-group input::placeholder { color: #3a5a7a; }
        .form-group input:focus, .form-group select:focus { border-color: rgba(0,180,255,0.5); }
        .form-group select option { background: #0a1628; color: #e0e8f0; }
        .submit-btn {
            width: 100%; height: 44px;
            background: linear-gradient(135deg, #0066cc, #0099ff);
            border: none; border-radius: 6px;
            color: white; font-size: 14px; font-weight: bold;
            letter-spacing: 2px; cursor: pointer;
            transition: opacity 0.2s;
        }
        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg { font-size: 12px; text-align: center; margin-top: 10px; min-height: 18px; }
        .footer-links { margin-top: 16px; text-align: center; font-size: 13px; }
        .footer-links a { color: #5a8aaa; text-decoration: none; }
        .footer-links a:hover { color: #00b4ff; }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        .particle { position: absolute; width: 2px; height: 2px; background: rgba(0,180,255,0.4); border-radius: 50%; animation: float linear infinite; }
        @keyframes float { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1); opacity: 0; } }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="particles" id="particles"></div>

    <div class="form-container">
        <div class="form-header">
            <h1>注册新账号</h1>
            <p>创建您的管网资产管理账号</p>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" id="regUsername" placeholder="3-20个字符" autocomplete="off">
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="regName" placeholder="您的姓名">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>密码 *</label>
                <input type="password" id="regPassword" placeholder="至少6位">
            </div>
            <div class="form-group">
                <label>确认密码 *</label>
                <input type="password" id="regPassword2" placeholder="再次输入密码">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="regPhone" placeholder="手机号码">
            </div>
            <div class="form-group">
                <label>所属部门</label>
                <input type="text" id="regDept" placeholder="部门/单位">
            </div>
        </div>
        <div class="form-group">
            <label>角色选择</label>
            <select id="regRole">
                <option value="viewer">监管查看员 — 查看基础面板</option>
                <option value="oam">运维人员 — 查看运维相关面板 + 导出数据</option>
                <option value="oam_lead">运维主管 — 更多面板 + 刷新数据</option>
            </select>
        </div>

        <button class="submit-btn" id="regBtn" onclick="doRegister()">注 册</button>
        <div class="msg" id="regMsg"></div>

        <div class="footer-links">
            已有账号？<a href="login.html">返回登录</a>
        </div>
    </div>

    <script>
    var API_BASE = location.protocol + '//' + location.hostname + ':8000';

    function doRegister() {
        var username = document.getElementById('regUsername').value.trim();
        var name = document.getElementById('regName').value.trim();
        var pass = document.getElementById('regPassword').value.trim();
        var pass2 = document.getElementById('regPassword2').value.trim();
        var phone = document.getElementById('regPhone').value.trim();
        var dept = document.getElementById('regDept').value.trim();
        var role = document.getElementById('regRole').value;
        var msgEl = document.getElementById('regMsg');
        var btn = document.getElementById('regBtn');

        if (!username || !pass) { msgEl.style.color='#ef4444'; msgEl.textContent='请填写用户名和密码'; return; }
        if (username.length < 3) { msgEl.style.color='#ef4444'; msgEl.textContent='用户名至少3个字符'; return; }
        if (pass.length < 6) { msgEl.style.color='#ef4444'; msgEl.textContent='密码至少6位'; return; }
        if (pass !== pass2) { msgEl.style.color='#ef4444'; msgEl.textContent='两次密码不一致'; return; }

        btn.disabled = true;
        btn.textContent = '注册中...';
        msgEl.textContent = '';

        fetch(API_BASE + '/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: pass, name: name, role: role, phone: phone, department: dept })
        })
        .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
        .then(function(result) {
            if (!result.ok) {
                msgEl.style.color = '#ef4444';
                msgEl.textContent = result.data.detail || '注册失败';
                btn.disabled = false;
                btn.textContent = '注 册';
                return;
            }
            msgEl.style.color = '#10b981';
            msgEl.textContent = '注册成功！3秒后跳转到登录页...';
            setTimeout(function() { window.location.href = 'login.html'; }, 3000);
        })
        .catch(function() {
            msgEl.style.color = '#ef4444';
            msgEl.textContent = '网络错误，请检查服务是否启动';
            btn.disabled = false;
            btn.textContent = '注 册';
        });
    }

    document.getElementById('regPassword2').addEventListener('keydown', function(e) { if (e.key === 'Enter') doRegister(); });

    (function createParticles() {
        var container = document.getElementById('particles');
        for (var i = 0; i < 30; i++) {
            var p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (6 + Math.random() * 10) + 's';
            p.style.animationDelay = (Math.random() * 8) + 's';
            p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
            container.appendChild(p);
        }
    })();
    </script>
</body>
</html>
