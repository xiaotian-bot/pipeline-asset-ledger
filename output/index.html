<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市管网资产数字化台账</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background:
                radial-gradient(circle at 15% 25%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 85% 75%, rgba(14, 165, 233, 0.10) 0%, transparent 50%),
                linear-gradient(135deg, #dbeafe 0%, #e0f2fe 40%, #f0f9ff 70%, #e0f2fe 100%);
            background-attachment: fixed;
            color: #1e293b;
            overflow-y: auto;
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15), transparent 70%);
            top: -180px; right: -180px;
            animation: floatOrb 30s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb-left {
            position: fixed;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.12), transparent 70%);
            bottom: -150px; left: -150px;
            animation: floatOrbLeft 25s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-100px, 120px); }
        }
        @keyframes floatOrbLeft {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(80px, -100px); }
        }
        .header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.95), rgba(14, 165, 233, 0.92), rgba(37, 99, 235, 0.90));
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.4);
            position: relative;
            padding: 0 24px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
            z-index: 10;
        }
        .header-left {
            position: absolute;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-left .divider {
            width: 1px;
            height: 24px;
            background: rgba(255,255,255,0.3);
        }
        .status-indicator {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
            animation: statusBreath 2s ease-in-out infinite;
        }
        @keyframes statusBreath {
            0%, 100% { box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }
            50% { box-shadow: 0 0 16px rgba(34, 197, 94, 0.9); }
        }
        .device-count {
            font-size: 12px;
            color: rgba(255,255,255,0.85);
        }
        .device-count strong {
            color: #fff;
            font-size: 14px;
        }
        .header-center {
            text-align: center;
            width: 100%;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 2px;
        }
        .header .subtitle {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            letter-spacing: 4px;
        }
        .header .time {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
        }
        .header-actions {
            position: absolute;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .data-update-time {
            font-size: 11px;
            color: rgba(255,255,255,0.85);
            white-space: nowrap;
        }
        .alert-ticker {
            height: 28px;
            background: linear-gradient(90deg, rgba(220,38,38,0.08), rgba(217,119,6,0.06), rgba(220,38,38,0.08));
            border-bottom: 1px solid rgba(220,38,38,0.15);
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }
        .alert-ticker .ticker-label {
            flex-shrink: 0;
            padding: 0 12px;
            font-size: 11px;
            font-weight: bold;
            color: #dc2626;
            background: rgba(220,38,38,0.1);
            height: 100%;
            display: flex;
            align-items: center;
            gap: 4px;
            border-right: 1px solid rgba(220,38,38,0.15);
        }
        .alert-ticker .ticker-track {
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
        }
        .alert-ticker .ticker-content {
            display: flex;
            align-items: center;
            gap: 40px;
            white-space: nowrap;
            animation: tickerScroll 30s linear infinite;
            padding-left: 100%;
        }
        .alert-ticker .ticker-content:hover { animation-play-state: paused; }
        .alert-ticker .ticker-item {
            font-size: 12px;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .alert-ticker .ticker-item .t-level {
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
        }
        .alert-ticker .ticker-item .t-level.urgent { background: #fef2f2; color: #dc2626; }
        .alert-ticker .ticker-item .t-level.important { background: #fffbeb; color: #d97706; }
        .alert-ticker .ticker-item .t-level.normal { background: #eff6ff; color: #2563eb; }
        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        .kpi-bar {
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 24px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.7));
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            position: relative;
            z-index: 2;
        }
        .kpi-item {
            text-align: center;
            position: relative;
            padding: 4px 16px;
            transition: transform 0.2s;
            cursor: default;
        }
        .kpi-item:hover { transform: translateY(-2px); }
        .kpi-item .value {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #1e40af, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .kpi-item .label {
            font-size: 11px;
            color: #475569;
            margin-top: 2px;
        }
        .kpi-item::after {
            content: '';
            position: absolute;
            bottom: 0; left: 10%; right: 10%;
            height: 2px;
            background: linear-gradient(90deg, #2563eb, #16a34a);
            border-radius: 1px;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        .kpi-item:hover::after { opacity: 0.8; }
        .main {
            display: grid;
            grid-template-columns: 1fr 1.3fr 1fr;
            grid-template-rows: repeat(5, minmax(220px, auto));
            gap: 16px;
            padding: 16px;
            position: relative;
        }
        .panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.08), inset 0 1px 0 rgba(255,255,255,0.6);
            transition: box-shadow 0.3s, border-color 0.3s, transform 0.3s;
            position: relative;
        }
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(59,130,246,0.5), rgba(14,165,233,0.5), transparent);
            z-index: 1;
        }
        .panel:hover {
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.22), inset 0 1px 0 rgba(255,255,255,0.6);
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.45);
        }
        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
            padding-left: 10px;
            border-left: 3px solid #2563eb;
            flex-shrink: 0;
            position: relative;
        }
        .panel-title::after {
            content: '';
            position: absolute;
            left: 0; bottom: -2px;
            width: 0; height: 1px;
            background: linear-gradient(90deg, #2563eb, transparent);
            transition: width 0.4s ease;
        }
        .panel:hover .panel-title::after { width: 100%; }
        .chart { flex: 1; min-height: 0; }
        .scroll-table {
            flex: 0 1 auto;
            max-height: 100%;
            overflow-y: auto;
            font-size: 12px;
        }
        .panel:has(> .scroll-table) {
            max-height: 320px;
        }
        .scroll-table table { width: 100%; border-collapse: collapse; }
        .scroll-table th {
            background: linear-gradient(180deg, #f8fafc, #f1f5f9);
            padding: 7px 8px;
            text-align: left;
            color: #475569;
            position: sticky;
            top: 0;
            font-size: 11px;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            z-index: 1;
        }
        .scroll-table td { padding: 5px 8px; border-bottom: 1px solid #f3f4f6; color: #374151; }
        .scroll-table tbody tr:nth-child(odd) { background: rgba(59, 130, 246, 0.03); }
        .scroll-table tbody tr:nth-child(even) { background: transparent; }
        .scroll-table tbody tr:hover {
            background: rgba(59, 130, 246, 0.10);
            box-shadow: inset 3px 0 0 #2563eb;
        }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .tag-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .tag-warning { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .tag-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .tag-info { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
        .btn-workflow {
            padding: 5px 14px;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-workflow:hover { background: #1d4ed8; }
        .btn-refresh {
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(6px);
        }
        .btn-refresh:hover { background: rgba(255, 255, 255, 0.35); }
        .btn-refresh:active { transform: scale(0.97); }
        .btn-refresh.loading { opacity: 0.5; pointer-events: none; }
        .btn-refresh.loading .refresh-icon { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .refresh-mode-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-toggle {
            padding: 5px 14px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(6px);
        }
        .btn-toggle:hover { background: rgba(255, 255, 255, 0.35); }
        .btn-toggle.active {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: #10b981;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
        }
        .btn-toggle.active:hover { background: linear-gradient(135deg, #059669, #047857); }
        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff;
            display: inline-block;
        }
        .btn-toggle.active .pulse-dot {
            animation: pulseDot 1.2s ease-in-out infinite;
            background: #fff;
            box-shadow: 0 0 6px #fff;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.4); }
        }
        .countdown {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.95);
            min-width: 36px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        body.auto-refreshing .panel::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            animation: scanLine 1.5s linear infinite;
            z-index: 1;
        }
        @keyframes scanLine { to { left: 100%; } }

        body.auto-refreshing .panel {
            animation: panelPulse 15s ease-in-out infinite;
        }
        @keyframes panelPulse {
            0%, 100% { box-shadow: 0 4px 16px rgba(59, 130, 246, 0.08); }
            50% { box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25); }
        }

        .btn-notification {
            position: relative;
            padding: 5px 10px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-notification:hover { background: rgba(255,255,255,0.3); }
        .btn-notification .badge {
            position: absolute;
            top: -6px; right: -6px;
            background: #dc2626;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .btn-notification .badge.hidden { display: none; }
        .btn-notification.urgent { animation: bellShake 0.6s ease-in-out infinite; }
        @keyframes bellShake {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(12deg); }
            40% { transform: rotate(-12deg); }
            60% { transform: rotate(8deg); }
            80% { transform: rotate(-8deg); }
        }

        .notification-dropdown {
            position: absolute;
            top: 60px;
            right: 24px;
            width: 380px;
            max-height: 480px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .notification-dropdown.show { display: flex; }
        .notification-dropdown .nd-header {
            padding: 10px 14px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
            font-weight: bold;
            color: #111827;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notification-dropdown .nd-body {
            overflow-y: auto;
            max-height: 400px;
        }
        .nd-item {
            padding: 8px 14px;
            border-bottom: 1px solid #f3f4f6;
            font-size: 12px;
            cursor: default;
            transition: background 0.15s;
        }
        .nd-item:hover { background: #f9fafb; }
        .nd-item.urgent-item { background: #fef2f2; border-left: 3px solid #dc2626; }
        .nd-item .nd-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .nd-item .nd-type { font-weight: bold; color: #111827; }
        .nd-item .nd-time { color: #9ca3af; font-size: 11px; }
        .nd-item .nd-bottom { color: #6b7280; font-size: 11px; }
        .nd-tag {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
        }
        .nd-tag-urgent { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .nd-tag-important { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .nd-tag-normal { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .nd-status { font-size: 10px; padding: 1px 5px; border-radius: 6px; }
        .nd-status-unprocessed { background: #fef2f2; color: #dc2626; }
        .nd-status-processing { background: #fffbeb; color: #d97706; }
        .nd-status-done { background: #f0fdf4; color: #16a34a; }
        .nd-actions { display: flex; gap: 6px; margin-top: 4px; }
        .nd-actions button {
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid;
            transition: all 0.2s;
        }
        .nd-btn-confirm {
            background: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }
        .nd-btn-confirm:hover { background: #2563eb; color: #fff; }
        .nd-btn-ignore {
            background: #f9fafb;
            color: #6b7280;
            border-color: #d1d5db;
        }
        .nd-btn-ignore:hover { background: #6b7280; color: #fff; }

        .panel-fullscreen-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            background: none;
            border: none;
            font-size: 14px;
            color: #9ca3af;
            cursor: pointer;
            z-index: 5;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.2s;
            line-height: 1;
        }
        .panel-fullscreen-btn:hover { color: #2563eb; background: rgba(59,130,246,0.1); }
        .panel {
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        @keyframes panelScaleIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
        .panel.panel-fullscreen {
            position: fixed !important;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999;
            border-radius: 0;
            margin: 0;
            background: #0f172a;
            overflow: auto !important;
            animation: panelScaleIn 0.35s cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        .panel.panel-fullscreen:hover { transform: scale(1) !important; }
        .panel.panel-fullscreen .panel-fullscreen-btn { display: none; }
        .panel.panel-fullscreen .panel-title { color: #e2e8f0; border-left-color: #60a5fa; }
        .panel.panel-fullscreen::after {
            content: '✕ 返回';
            position: absolute;
            top: 14px;
            right: 20px;
            font-size: 14px;
            color: #e2e8f0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            padding: 6px 16px;
            cursor: pointer;
            z-index: 10;
            transition: background 0.2s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .panel.panel-fullscreen::after:hover { background: rgba(255,255,255,0.2); }
        body.panel-is-fullscreen .header,
        body.panel-is-fullscreen .kpi-bar,
        body.panel-is-fullscreen .alert-ticker,
        body.panel-is-fullscreen .time-filter-bar {
            display: none !important;
        }

        .panel-map { grid-column: span 2; overflow: visible; }

        .time-filter-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 24px;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid rgba(59,130,246,0.15);
            position: relative;
            z-index: 2;
        }
        .time-filter-bar .tf-label {
            font-size: 12px;
            color: #6b7280;
            font-weight: 600;
            white-space: nowrap;
        }
        .time-filter-bar .tf-btn {
            padding: 4px 14px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            background: #fff;
            color: #374151;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .time-filter-bar .tf-btn:hover { border-color: #2563eb; color: #2563eb; }
        .time-filter-bar .tf-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }
        .time-filter-bar .tf-custom {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .time-filter-bar .tf-custom input[type="date"] {
            padding: 3px 8px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 12px;
            color: #374151;
            outline: none;
        }
        .time-filter-bar .tf-custom input[type="date"]:focus { border-color: #2563eb; }
        .time-filter-bar .tf-custom .tf-apply {
            padding: 3px 10px;
            background: #2563eb;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
        }
        .time-filter-bar .tf-custom .tf-apply:hover { background: #1d4ed8; }

        .btn-refresh, .btn-toggle, .btn-export {
            position: relative;
            overflow: hidden;
        }

    <script>
    var API_BASE = location.protocol + '//' + location.hostname + ':8000';
    var currentUser = null;
    var currentTimeRange = 'all';
    var customStartDate = '';
    var customEndDate = '';

    function getTimeParams() {
        var now = new Date();
        var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
        var fmt = function(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
        var sd = '', ed = '';
        if (currentTimeRange === 'today') {
            sd = ed = fmt(now);
        } else if (currentTimeRange === 'week') {
            var day = now.getDay() || 7;
            var mon = new Date(now);
            mon.setDate(now.getDate() - day + 1);
            sd = fmt(mon);
            ed = fmt(now);
        } else if (currentTimeRange === 'month') {
            sd = fmt(new Date(now.getFullYear(), now.getMonth(), 1));
            ed = fmt(now);
        } else if (currentTimeRange === 'custom') {
            sd = customStartDate;
            ed = customEndDate;
        }
        if (!sd && !ed) return '';
        return '&start_date=' + sd + '&end_date=' + ed;
    }

    function setTimeRange(range) {
        currentTimeRange = range;
        document.querySelectorAll('.tf-btn').forEach(function(b) {
            b.classList.toggle('active', b.getAttribute('data-range') === range);
        });
        var customEl = document.getElementById('tfCustom');
        if (customEl) customEl.style.display = range === 'custom' ? 'flex' : 'none';
        if (range !== 'custom') {
            refreshData();
        }
    }

    function applyCustomRange() {
        var sd = document.getElementById('tfStartDate').value;
        var ed = document.getElementById('tfEndDate').value;
        if (!sd || !ed) return;
        customStartDate = sd;
        customEndDate = ed;
        refreshData();
    }

    var ROLE_NAMES = {
        super_admin: '超级管理员', admin: '系统管理员',
        oam_lead: '运维主管', oam: '运维人员', viewer: '监管查看员'
    };

    function escapeHtml(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function getToken() { return localStorage.getItem('pipeline_token') || ''; }
    function authHeaders() { return { 'Authorization': 'Bearer ' + getToken() }; }

    (function checkLogin() {
        var token = getToken();
        var userStr = localStorage.getItem('pipeline_user');
        if (!token || !userStr) { window.location.href = 'login.html'; return; }
        try { currentUser = JSON.parse(userStr); } catch(e) { window.location.href = 'login.html'; return; }

        var el = document.getElementById('userInfo');
        if (el) {
            var safeName = escapeHtml(currentUser.name || currentUser.username);
            var safeRole = ROLE_NAMES[currentUser.role] || currentUser.role;
            el.innerHTML = '<span style="color:#16a34a">' + safeName + '</span> <span style="color:#6b7280;font-size:11px">(' + safeRole + ')</span> <a href="login.html" onclick="localStorage.removeItem(\'pipeline_token\');localStorage.removeItem(\'pipeline_user\')" style="color:#dc2626;font-size:11px;margin-left:8px;text-decoration:none;border:1px solid #fecaca;padding:2px 8px;border-radius:3px;">退出</a>';
        }
        applyPermissions(currentUser.role);
    })();

    function applyPermissions(role) {
        document.querySelectorAll('.panel[data-permission]').forEach(function(panel) {
            var allowed = panel.getAttribute('data-permission').split(',');
            if (allowed.indexOf(role) === -1) {
                panel.style.display = 'none';
            }
        });
        if (role !== 'super_admin' && role !== 'admin') {
            var wf = document.querySelector('.btn-workflow');
            if (wf) wf.style.display = 'none';
            var tg = document.querySelector('.refresh-mode-group');
            if (tg) tg.style.display = 'none';
            var rf = document.getElementById('btnRefresh');
            if (rf) rf.style.display = 'none';
        }
        var visiblePanels = document.querySelectorAll('.panel:not([style*="display: none"])');
        var count = visiblePanels.length;
        var main = document.querySelector('.main');
        if (count <= 4) {
            main.style.gridTemplateColumns = 'repeat(4, 1fr)';
            main.style.gridTemplateRows = 'minmax(260px, auto)';
        } else if (count <= 8) {
            main.style.gridTemplateColumns = 'repeat(4, 1fr)';
            main.style.gridTemplateRows = 'repeat(2, minmax(260px, auto))';
        }
    }

    let charts = {};

    function initCharts() {
        var chartDefs = {
            typePie: 'chartTypePie',
            diameterMaterial: 'chartDiameterMaterial',
            region: 'chartRegion',
            status: 'chartStatus',
            decade: 'chartDecade',
            cost: 'chartCost',
            inventory: 'chartInventory',
            diffType: 'chartDiffType',
            checkMethod: 'chartCheckMethod',
            risk: 'chartRisk',
            map: 'chartMap'
        };
        Object.keys(chartDefs).forEach(function(key) {
            var el = document.getElementById(chartDefs[key]);
            if (el && el.offsetParent !== null) {
                charts[key] = echarts.init(el);
            }
        });
    }

    async function fetchData(url) {
        try {
            var fullUrl = url.indexOf('?') === -1 ? url + '?_=1' + getTimeParams() : url + getTimeParams();
            const res = await fetch(API_BASE + fullUrl, { headers: authHeaders() });
            if (!res.ok) return null;
            return await res.json();
        } catch (e) {
            console.error(`Fetch error: ${url}`, e);
            return null;
        }
    }

    function animateValue(el, start, end, duration, formatter) {
        var startTime = null;
        function step(ts) {
            if (!startTime) startTime = ts;
            var progress = Math.min((ts - startTime) / duration, 1);
            var eased = 1 - Math.pow(1 - progress, 3);
            var current = start + (end - start) * eased;
            el.textContent = formatter(current);
            if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    function renderKPI(data) {

            { label: '管网总里程', raw: data.total_length_km || 0, unit: 'km', fmt: function(v) { return v.toLocaleString(undefined, {maximumFractionDigits:1}); } },
            { label: '资产总值', raw: (data.total_net_value || 0) / 10000, unit: '万元', fmt: function(v) { return Math.round(v).toLocaleString(); } },
            { label: '资产成新率', raw: (data.newness_rate || 0) * 100, unit: '%', fmt: function(v) { return v.toFixed(1); } },

    function renderTicker(alertData) {
        if (!alertData) return;
        var alerts = alertData.alerts || [];
        var content = document.getElementById('tickerContent');
        if (!content) return;
        if (!alerts.length) { content.innerHTML = '<span class="ticker-item" style="color:#9ca3af">暂无预警信息</span>'; return; }
        var sorted = alerts.slice().sort(function(a, b) {
            var lo = { '紧急': 0, '重要': 1, '一般': 2 };
            return (lo[a.level] || 2) - (lo[b.level] || 2);
        });
        var html = '';
        sorted.slice(0, 15).forEach(function(a) {
            var lc = a.level === '紧急' ? 'urgent' : a.level === '重要' ? 'important' : 'normal';
            html += '<span class="ticker-item"><span class="t-level ' + lc + '">' + escapeHtml(a.level) + '</span>' + escapeHtml(a.alert_type) + ' - ' + escapeHtml(a.asset_id) + ' (' + escapeHtml(a.region) + ') ' + escapeHtml(a.time) + '</span>';
        });
        content.innerHTML = html;
    }

    function renderDiffType(diffData) {
        if (!diffData || !diffData.length) return;
        const totalMissing = diffData.reduce((s, d) => s + (d.missing || 0), 0);
        const totalExtra = diffData.reduce((s, d) => s + (d.extra || 0), 0);
        const totalMismatch = diffData.reduce((s, d) => s + (d.mismatch || 0), 0);
        const totalDiff = totalMissing + totalExtra + totalMismatch;
        const totalChecked = diffData.reduce((s, d) => s + d.total_checked, 0);
        const matchCount = totalChecked - totalDiff;

        const data = [
            { name: '差异-缺失', value: totalMissing, color: '#dc2626' },
            { name: '差异-多余', value: totalExtra, color: '#d97706' },
            { name: '差异-信息不符', value: totalMismatch, color: '#2563eb' },
            { name: '账实一致', value: matchCount > 0 ? matchCount : totalChecked * 0.95, color: '#16a34a' }
        ];

        charts.diffType.setOption({
            tooltip: { trigger: 'item', formatter: '{b}: {c}项 ({d}%)' },
            legend: { bottom: 2, textStyle: { color: '#6b7280', fontSize: 10 }, itemWidth: 12, itemHeight: 8 },

    var autoRefreshEnabled = false;
    var autoRefreshTimer = null;
    var countdownTimer = null;
    var countdownSec = 15;

    function toggleAutoRefresh() {
        autoRefreshEnabled = !autoRefreshEnabled;
        var btn = document.getElementById('btnToggle');
        var text = document.getElementById('toggleText');
        var cd = document.getElementById('countdown');
        if (autoRefreshEnabled) {
            btn.classList.add('active');
            text.textContent = '自动刷新';
            document.body.classList.add('auto-refreshing');
            startAutoRefresh();
        } else {
            btn.classList.remove('active');
            text.textContent = '手动刷新';
            document.body.classList.remove('auto-refreshing');
            stopAutoRefresh();
            cd.textContent = '';
        }
    }

    function startAutoRefresh() {
        stopAutoRefresh();
        countdownSec = 15;
        updateCountdownDisplay();
        autoRefreshTimer = setInterval(async function() {
            await refreshData();
            countdownSec = 15;
            updateCountdownDisplay();
        }, 15000);
        countdownTimer = setInterval(function() {
            countdownSec = Math.max(0, countdownSec - 1);
            updateCountdownDisplay();
        }, 1000);
    }

    function stopAutoRefresh() {
        if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    }

    function resetCountdown() {
        countdownSec = 15;
        updateCountdownDisplay();
    }

    function updateCountdownDisplay() {
        var cd = document.getElementById('countdown');
        if (cd && autoRefreshEnabled) cd.textContent = countdownSec + 's';
    }

    function renderMap(mapData) {
        if (!mapData || !mapData.length) return;
        var maxAssets = Math.max.apply(null, mapData.map(function(d) { return d.asset_count; }));
        var scatterData = mapData.map(function(d) {
            return {
                name: d.region,
                value: d.coords.concat([d.asset_count, d.avg_risk, d.high_risk_count, d.alert_count]),
                itemStyle: {
                    color: d.avg_risk >= 60 ? '#dc2626' : d.avg_risk >= 40 ? '#d97706' : '#16a34a',
                    opacity: 0.75
                }
            };
        });
        var effectData = mapData.filter(function(d) { return d.avg_risk >= 55 || d.urgent_alerts > 0; }).map(function(d) {
            return {
                name: d.region,
                value: d.coords.concat([d.asset_count, d.avg_risk, d.high_risk_count, d.alert_count]),
                itemStyle: { color: d.avg_risk >= 60 ? '#dc2626' : '#d97706' }
            };
        });

        // 坐标轴范围按实际点位动态计算：换城市 / 换坐标系都不需要改代码。
        // 原来硬编码的是北京一带（116.1~116.8 / 39.65~40.05），
        // 而 /map/data 返回的是陕西安塞（约 109.0~109.6 / 36.7~37.0），
        // 散点全部落在轴范围外，被 ECharts 裁掉导致地图一片空白。
        var lngs = [], lats = [];
        mapData.forEach(function(d) {
            if (!d.coords) return;
            var lng = Number(d.coords[0]), lat = Number(d.coords[1]);
            if (isFinite(lng) && isFinite(lat)) { lngs.push(lng); lats.push(lat); }
        });
        function axisRange(values, padding) {
            if (!values.length) return null;                    // 无有效坐标时交给 ECharts 自动计算
            var lo = Math.min.apply(null, values), hi = Math.max.apply(null, values);
            if (hi - lo < 1e-6) { lo -= 0.01; hi += 0.01; }      // 单点/坐标重合时给一个最小跨度
            var pad = (hi - lo) * padding;
            return [lo - pad, hi + pad];
        }
        var lngRange = axisRange(lngs, 0.15);
        var latRange = axisRange(lats, 0.15);
        var xAxisOpt = { type: 'value', show: false, scale: true };
        var yAxisOpt = { type: 'value', show: false, scale: true };
        if (lngRange) { xAxisOpt.min = lngRange[0]; xAxisOpt.max = lngRange[1]; }
        if (latRange) { yAxisOpt.min = latRange[0]; yAxisOpt.max = latRange[1]; }

        charts.map.setOption({
            tooltip: {
                trigger: 'item',
                formatter: function(p) {
                    var v = p.value;
                    return '<b>' + p.name + '</b><br/>' +
                        '资产数量: ' + v[2] + ' 段<br/>' +
                        '平均风险: ' + v[3] + ' 分<br/>' +
                        '高风险资产: ' + v[4] + ' 项<br/>' +
                        '预警数量: ' + v[5] + ' 条';
                }
            },
            xAxis: xAxisOpt,
            yAxis: yAxisOpt,
            grid: { top: 10, right: 10, bottom: 10, left: 10 },
            series: [
                {
                    type: 'scatter',
                    data: scatterData,
                    symbolSize: function(val) {
                        return Math.max(18, (val[2] / maxAssets) * 55);
                    },
                    label: {
                        show: true,
                        formatter: function(p) { return p.name; },
                        position: 'bottom',
                        fontSize: 10,
                        color: '#374151'
                    },
                    emphasis: { scale: 1.4 }
                },
                {
                    type: 'effectScatter',
                    data: effectData,
                    symbolSize: function(val) {
                        return Math.max(14, (val[2] / maxAssets) * 40);
                    },
                    rippleEffect: { brushType: 'stroke', scale: 2.5, period: 3 },
                    label: { show: false }
                }
            ]
        });
    }

    function toggleNotification() {
        var dd = document.getElementById('notificationDropdown');
        dd.classList.toggle('show');
    }

    document.addEventListener('click', function(e) {
        var btn = document.getElementById('btnNotification');
        var dd = document.getElementById('notificationDropdown');
        if (dd.classList.contains('show') && !dd.contains(e.target) && !btn.contains(e.target)) {
            dd.classList.remove('show');
        }
    });

    function updateNotification(alertData) {
        if (!alertData) return;
        var unread = alertData.unread_count || 0;
        var alerts = alertData.alerts || [];
        var badge = document.getElementById('alertBadge');
        var bell = document.getElementById('btnNotification');
        var countEl = document.getElementById('alertUnreadCount');
        var body = document.getElementById('notificationBody');

        if (unread > 0) {
            badge.textContent = unread;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }

        var hasUrgent = alerts.some(function(a) { return a.level === '紧急' && a.status === '未处理'; });
        if (hasUrgent) { bell.classList.add('urgent'); } else { bell.classList.remove('urgent'); }

        countEl.textContent = unread > 0 ? unread + ' 条未处理' : '全部已处理';

        var sorted = alerts.slice().sort(function(a, b) {
            var levelOrder = { '紧急': 0, '重要': 1, '一般': 2 };
            var statusOrder = { '未处理': 0, '处理中': 1, '已处理': 2 };
            return (levelOrder[a.level] || 2) - (levelOrder[b.level] || 2) || (statusOrder[a.status] || 2) - (statusOrder[b.status] || 2);
        });

        var top20 = sorted.slice(0, 20);
        var html = '';
        var isViewer = currentUser && currentUser.role === 'viewer';
        top20.forEach(function(a) {
            var tagClass = a.level === '紧急' ? 'nd-tag-urgent' : a.level === '重要' ? 'nd-tag-important' : 'nd-tag-normal';
            var statusClass = a.status === '未处理' ? 'nd-status-unprocessed' : a.status === '处理中' ? 'nd-status-processing' : 'nd-status-done';
            var isUrgent = a.level === '紧急' && a.status === '未处理' ? ' urgent-item' : '';
            var actions = '';
            if (a.status === '未处理' && !isViewer) {
                actions = '<div class="nd-actions">' +
                    '<button class="nd-btn-confirm" onclick="handleAlertAction(\'' + a.alert_id + '\', \'confirm\')">确认</button>' +
                    '<button class="nd-btn-ignore" onclick="handleAlertAction(\'' + a.alert_id + '\', \'ignore\')">忽略</button>' +
                '</div>';
            }
            html += '<div class="nd-item' + isUrgent + '">' +
                '<div class="nd-top">' +
                    '<span><span class="nd-tag ' + tagClass + '">' + escapeHtml(a.level) + '</span> ' +
                    '<span class="nd-type">' + escapeHtml(a.alert_type) + '</span></span>' +
                    '<span class="nd-status ' + statusClass + '">' + escapeHtml(a.status) + '</span>' +
                '</div>' +
                '<div class="nd-bottom">' +
                    escapeHtml(a.asset_id) + ' · ' + escapeHtml(a.region) + ' · ' + escapeHtml(a.time) +
                '</div>' +
                actions +
            '</div>';
        });
        if (!html) html = '<div style="padding:20px;text-align:center;color:#9ca3af;font-size:12px;">暂无预警</div>';
        body.innerHTML = html;
    }

    var alertPollTimer = null;
    function startAlertPolling() {
        if (alertPollTimer) clearInterval(alertPollTimer);
        alertPollTimer = setInterval(async function() {
            var data = await fetchData('/alerts');
            updateNotification(data);
        }, 60000);
    }

    function toggleFullscreen(btn) {
        var panel = btn.closest('.panel');
        var isFullscreen = panel.classList.contains('panel-fullscreen');
        if (!isFullscreen) {
            var panelRect = panel.getBoundingClientRect();
            panel._savedHeight = panelRect.height;
            var placeholder = document.createElement('div');
            placeholder.className = 'panel-placeholder';
            placeholder.style.cssText = 'visibility:hidden;height:' + panelRect.height + 'px;overflow:hidden;';
            panel.parentNode.insertBefore(placeholder, panel);
            panel._placeholder = placeholder;
            document.body.classList.add('panel-is-fullscreen');
            panel.classList.add('panel-fullscreen');
            panel.addEventListener('click', function fsCloseHandler(e) {
                if (e.target === panel) {
                    panel.removeEventListener('click', fsCloseHandler);
                    closeFullscreen();
                }
            });
        } else {
            closeFullscreen();
        }
        setTimeout(function() { Object.values(charts).forEach(function(c) { c.resize(); }); }, 100);
    }

    function closeFullscreen() {
        var panel = document.querySelector('.panel.panel-fullscreen');
        if (panel) {
            panel.classList.remove('panel-fullscreen');
            if (panel._savedHeight) {
                panel.style.height = panel._savedHeight + 'px';
            }
            if (panel._placeholder) {
                panel._placeholder.parentNode.removeChild(panel._placeholder);
                panel._placeholder = null;
            }
        }
        document.body.classList.remove('panel-is-fullscreen');
        setTimeout(function() {
            Object.values(charts).forEach(function(c) { c.resize(); });
        }, 150);
    }

    async function handleAlertAction(alertId, action) {
        var token = getToken();
        try {
            var resp = await fetch(API_BASE + '/alerts/' + alertId + '/status', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ action: action })
            });
            if (!resp.ok) {
                var err = await resp.json();
                alert(err.detail || '操作失败');
                return;
            }
            var data = await fetchData('/alerts');
            updateNotification(data);
        } catch (e) {
            console.error('预警操作失败:', e);
        }
    }

    // ---------- 单资产档案穿透弹窗 ----------
    var currentAssetId = null;
    var currentAssetDetail = null;

    function showToast(msg, type) {
        var t = document.getElementById('simpleToast');
        if (!t) return;
        t.textContent = msg;
        t.className = 'toast-simple show ' + (type || 'info');
        clearTimeout(t._timer);
        t._timer = setTimeout(function() { t.className = 'toast-simple'; }, 2600);
    }

    function openAssetModal(assetId) {
        if (!assetId) return;
        currentAssetId = assetId;
        currentAssetDetail = null;
        var mask = document.getElementById('assetModalMask');
        document.getElementById('assetModalTitle').textContent = assetId;
        document.getElementById('assetModalBody').innerHTML = '<div class="am-loading">正在加载资产档案…</div>';
        mask.classList.add('show');
        fetchData('/asset/detail/' + encodeURIComponent(assetId)).then(function(data) {
            if (!mask.classList.contains('show') || currentAssetId !== assetId) return;
            if (!data || !data.asset) {
                document.getElementById('assetModalBody').innerHTML = '<div class="am-empty">未获取到该资产档案数据</div>';
                return;
            }
            currentAssetDetail = data;
            renderAssetModal(data);
        });
    }

    function closeAssetModal() {
        document.getElementById('assetModalMask').classList.remove('show');
        currentAssetId = null;
        currentAssetDetail = null;
    }

    function renderAssetModal(data) {
        var a = data.asset;
        var riskTag = a.risk_level === '极高' ? 'red' : a.risk_level === '高' ? 'amber' : a.risk_level === '中' ? 'blue' : 'green';
        var statusTag = a.status === '在用' ? 'green' : a.status === '报废' ? 'gray' : 'amber';
        var html = '';

        html += '<div class="am-tags">' +
            '<span class="am-tag blue">' + escapeHtml(a.pipeline_type || '-') + '</span>' +
            '<span class="am-tag ' + statusTag + '">' + escapeHtml(a.status || '-') + '</span>' +
            '<span class="am-tag ' + riskTag + '">风险 ' + escapeHtml(a.risk_level || '-') + ' · ' + a.risk_score + '分</span>' +
            '<span class="am-tag gray">' + escapeHtml(a.region || '-') + '</span>' +
            (data.in_ledger ? '<span class="am-tag green">已入台账</span>' : '<span class="am-tag gray">台账外资产（合成档案）</span>') +
        '</div>';

        html += '<div class="am-sec"><div class="am-sec-title">基础信息</div><div class="am-grid">' +
            '<div class="am-field"><span>管径</span><b>' + escapeHtml(a.diameter || '-') + '</b></div>' +
            '<div class="am-field"><span>材质</span><b>' + escapeHtml(a.material || '-') + '</b></div>' +
            '<div class="am-field"><span>敷设年份</span><b>' + a.install_year + '</b></div>' +
            '<div class="am-field"><span>已服役</span><b>' + a.service_years + ' 年</b></div>' +
            '<div class="am-field"><span>设计寿命</span><b>' + a.design_life + ' 年</b></div>' +
            '<div class="am-field"><span>管段长度</span><b>' + a.length_m + ' m</b></div>' +
            '<div class="am-field"><span>埋深</span><b>' + a.burial_depth_m + ' m</b></div>' +
            '<div class="am-field"><span>折旧率</span><b>' + (a.depreciation_rate * 100).toFixed(2) + '%/年</b></div>' +
        '</div></div>';

        var own = data.ownership || {};
        html += '<div class="am-sec"><div class="am-sec-title">权属与责任边界</div>' +
            '<div class="am-owner-cards">' +
            '<div class="am-owner-card own"><span>产权单位</span><b>' + escapeHtml(own.ownership_unit || '-') + '</b></div>' +
            '<div class="am-owner-card oam"><span>运维单位</span><b>' + escapeHtml(own.oam_unit || '-') + '</b></div>' +
            '<div class="am-owner-card sup"><span>监管单位</span><b>' + escapeHtml(own.supervision_unit || '-') + '</b></div>' +
            '</div><div class="am-resp">' + escapeHtml(own.responsibility || '') + '</div></div>';

        var v = data.value || {};
        var newness = Math.round((v.newness_rate || 0) * 100);
        html += '<div class="am-sec"><div class="am-sec-title">资产价值（' + escapeHtml(v.depreciation_method || '年限平均法') + '）</div><div class="am-grid">' +
            '<div class="am-field"><span>资产原值</span><b>¥' + Number(v.original_value || 0).toLocaleString() + '</b></div>' +
            '<div class="am-field"><span>年折旧额</span><b>¥' + Number(v.annual_depreciation || 0).toLocaleString() + '</b></div>' +
            '<div class="am-field"><span>累计折旧</span><b>¥' + Number(v.accumulated_depreciation || 0).toLocaleString() + '</b></div>' +
            '<div class="am-field"><span>资产净值</span><b>¥' + Number(v.net_value || 0).toLocaleString() + '</b></div>' +
            '</div><div class="am-newness"><span>成新率 ' + newness + '%</span>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + newness + '%"></div></div></div></div>';

        var events = data.lifecycle || [];
        html += '<div class="am-sec"><div class="am-sec-title">全生命周期档案（' + events.length + ' 条 · 累计投入 ¥' + Number(data.total_cost || 0).toLocaleString() + '）</div>';
        if (events.length) {
            html += '<ul class="am-timeline">';
            events.forEach(function(e) {
                var dotClass = e.event_type === '报废处置' ? 'gray' : e.event_type === '改造更新' ? 'amber' : (e.event_type === '采购' || e.event_type === '施工安装') ? 'blue' : 'green';
                html += '<li class="' + dotClass + '">' +
                    '<div class="tl-head"><b>' + escapeHtml(e.event_type) + '</b><span class="tl-date">' + escapeHtml(e.event_date || '') + '</span><span class="tl-cost">¥' + Number(e.cost || 0).toLocaleString() + '</span></div>' +
                    '<div class="tl-desc">' + escapeHtml(e.description || '') + '<br>责任单位：' + escapeHtml(e.responsible_unit || '-') + '</div>' +
                '</li>';
            });
            html += '</ul>';
        } else {
            html += '<div class="am-empty">暂无生命周期记录</div>';
        }
        html += '</div>';

        var checks = data.inventory_checks || [];
        html += '<div class="am-sec"><div class="am-sec-title">盘点记录（账实核对）</div>';
        if (checks.length) {
            html += '<div class="am-table-wrap"><table class="am-table"><tr><th>盘点单号</th><th>方式</th><th>差异</th><th>盘点时间</th><th>状态</th><th>操作</th></tr>';
            checks.forEach(function(c) {
                var diffText = c.diff_status === '不一致' ? (escapeHtml(c.diff_field || '') + '不符') : '一致';
                var stClass = c.status === '待处理' ? 'red' : c.status === '已销号' ? 'gray' : 'green';
                var actions = c.status === '待处理'
                    ? '<button class="am-btn verify" onclick="amResolve(\'' + c.check_id + '\',\'核实确认\')">核实</button>' +
                      '<button class="am-btn writeoff" onclick="amResolve(\'' + c.check_id + '\',\'差异销号\')">销号</button>'
                    : '<span style="color:#94a3b8;font-size:10px;">' + escapeHtml(c.resolved_by || '') + ' ' + escapeHtml(c.resolved_at || '') + '</span>';
                html += '<tr><td>' + escapeHtml(c.check_id) + '</td><td>' + escapeHtml(c.check_method || '') + '</td>' +
                    '<td><span class="am-tag ' + (c.diff_status === '不一致' ? 'red' : 'green') + '" style="font-size:10px;">' + diffText + '</span></td>' +
                    '<td>' + escapeHtml(c.check_time || '') + '</td>' +
                    '<td><span class="am-tag ' + stClass + '" style="font-size:10px;">' + escapeHtml(c.status) + '</span></td>' +
                    '<td>' + actions + '</td></tr>';
            });
            html += '</table></div>';
        } else {
            html += '<div class="am-empty">该资产暂无盘点差异记录</div>';
        }
        html += '</div>';

        var alerts = data.alerts || [];
        html += '<div class="am-sec"><div class="am-sec-title">关联预警（' + alerts.length + '）</div>';
        if (alerts.length) {
            html += '<ul class="am-timeline">';
            alerts.forEach(function(al) {
                var lvClass = al.level === '紧急' ? 'red' : al.level === '重要' ? 'amber' : 'blue';
                html += '<li class="' + lvClass + '">' +
                    '<div class="tl-head"><b>' + escapeHtml(al.alert_type || '预警') + '</b><span class="tl-date">' + escapeHtml(al.time || '') + '</span></div>' +
                    '<div class="tl-desc">' + escapeHtml(al.level || '') + ' · ' + escapeHtml(al.status || '') + '</div>' +
                '</li>';
            });
            html += '</ul>';
        } else {
            html += '<div class="am-empty">该资产暂无关联预警</div>';
        }
        html += '</div>';

        document.getElementById('assetModalBody').innerHTML = html;
    }

    async function amResolve(checkId, action) {
        var note = prompt('请输入处置说明（' + action + '）：', '');
        if (note === null) return;
        var token = getToken();
        try {
            var resp = await fetch(API_BASE + '/inventory/checks/' + checkId + '/resolve', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ action: action, note: note })
            });
            var result = await resp.json();
            if (!resp.ok) {
                showToast(result.detail || '处置失败', 'error');
                return;
            }
            showToast(result.message || '处置成功', 'success');
            if (currentAssetId) {
                var data = await fetchData('/asset/detail/' + encodeURIComponent(currentAssetId));
                if (data && data.asset) { currentAssetDetail = data; renderAssetModal(data); }
            }
        } catch (e) {
            showToast('处置请求失败', 'error');
        }
    }

    window.addEventListener('resize', () => { Object.values(charts).forEach(c => c.resize()); });

    initCharts();
    loadAllData();
    startAlertPolling();
    updateTime();
    setInterval(updateTime, 1000);
    </script>
    <div class="am-mask" id="assetModalMask" onclick="if(event.target===this)closeAssetModal()">
        <div class="am-box">
            <div class="am-head">
                <span class="am-id" id="assetModalTitle">资产档案</span>
                <span class="am-sub">全生命周期数字档案 · 一物一档</span>
                <button class="am-close" onclick="closeAssetModal()" title="关闭">✕</button>
            </div>
            <div class="am-body" id="assetModalBody">
                <div class="am-loading">档案加载中...</div>
            </div>
        </div>
    </div>
    <div class="toast-simple" id="simpleToast"></div>
</body>
</html>
